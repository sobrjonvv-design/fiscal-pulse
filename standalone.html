    // Helper functions
    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, Number(val.toFixed(2))));
    }

    function calculateEffectiveTaxYield(rate, optimalRate, elasticity) {
      const normRate = rate / 100;
      const normOptimal = optimalRate / 100;
      if (normRate <= normOptimal) return normRate;
      const excess = normRate - normOptimal;
      const penalty = Math.pow(excess, 1.55) * elasticity;
      return Math.max(0.03, normRate - penalty);
    }

    function calculateBudgetPreview(current, alloc) {
      const compliance = current.complianceFactor;
      const corpEff = calculateEffectiveTaxYield(alloc.corporateTax, 22, 1.35);
      const incEff = calculateEffectiveTaxYield(alloc.incomeTax, 28, 1.20);
      const vatEff = calculateEffectiveTaxYield(alloc.vat, 16, 1.15);

      const corpRev = current.gdp * 0.25 * corpEff * compliance;
      const incRev = current.gdp * 0.40 * incEff * compliance;
      const vatRev = current.gdp * 0.35 * vatEff * compliance;

      const totalTaxRevenue = Number((corpRev + incRev + vatRev).toFixed(1));
      const totalInflows = Number((totalTaxRevenue + alloc.sovereignBorrowing).toFixed(1));

      const nominalDebt = (current.debtToGdp / 100) * current.gdp;
      const debtRiskPremium = current.debtToGdp > 90 ? (current.debtToGdp - 90) * 0.075 : current.debtToGdp > 60 ? (current.debtToGdp - 60) * 0.030 : 0;
      const effectiveInterestRate = clamp(current.baseInterestRate + debtRiskPremium, 1.5, 18.0);
      const mandatoryInterestDue = Number(((nominalDebt * (effectiveInterestRate / 100)) * 0.50).toFixed(1));

      const totalExpenditure = Number((alloc.infrastructure + alloc.educationRd + alloc.healthcareSocial + alloc.industrialSubsidies + alloc.debtServicing).toFixed(1));
      const fiscalBalance = Number((totalTaxRevenue - totalExpenditure).toFixed(1));

      return {
        totalTaxRevenue,
        totalInflows,
        totalExpenditure,
        mandatoryInterestDue,
        effectiveInterestRate,
        fiscalBalance,
        fiscalStatus: fiscalBalance >= 0 ? 'SURPLUS' : 'DEFICIT'
      };
    }

    function simulateFiscalRound(current, alloc, shockOption) {
      const shockEffect = shockOption.effects;
      const explanations = [];

      const nextCompliance = clamp(current.complianceFactor + (shockEffect.complianceDelta || 0), 0.60, 1.08);

      const corpEff = calculateEffectiveTaxYield(alloc.corporateTax, 22, 1.35);
      const incEff = calculateEffectiveTaxYield(alloc.incomeTax, 28, 1.20);
      const vatEff = calculateEffectiveTaxYield(alloc.vat, 16, 1.15);

      const corpRev = current.gdp * 0.25 * corpEff * nextCompliance;
      const incRev = current.gdp * 0.40 * incEff * nextCompliance;
      const vatRev = current.gdp * 0.35 * vatEff * nextCompliance;

      const totalTaxRevenue = Number((corpRev + incRev + vatRev).toFixed(1));
      const totalInflows = Number((totalTaxRevenue + alloc.sovereignBorrowing).toFixed(1));

      const nominalDebt = (current.debtToGdp / 100) * current.gdp;
      const debtRiskPremium = current.debtToGdp > 90 ? (current.debtToGdp - 90) * 0.075 : current.debtToGdp > 60 ? (current.debtToGdp - 60) * 0.030 : 0;
      const effectiveInterestRate = clamp(current.baseInterestRate + debtRiskPremium, 1.5, 18.0);
      const mandatoryInterestDue = Number(((nominalDebt * (effectiveInterestRate / 100)) * 0.50).toFixed(1));

      const totalExpenditure = Number((alloc.infrastructure + alloc.educationRd + alloc.healthcareSocial + alloc.industrialSubsidies + alloc.debtServicing).toFixed(1));

      const liquidCashDelta = Number((totalInflows - totalExpenditure + (shockEffect.treasuryDelta || 0)).toFixed(1));
      const nextTreasury = Number((current.treasury + liquidCashDelta).toFixed(1));
      const capitalDelta = Number((nextTreasury - current.treasury).toFixed(1));
      const capitalDeltaPct = Number(((capitalDelta / Math.max(1, current.treasury)) * 100).toFixed(1));

      const structuralFiscalBalance = Number((totalTaxRevenue - totalExpenditure).toFixed(1));
      const fiscalStatus = structuralFiscalBalance >= 0 ? 'SURPLUS' : 'DEFICIT';

      if (fiscalStatus === 'SURPLUS') {
        explanations.push(`Fiscal Surplus Achieved: Tax revenues ($${totalTaxRevenue}M) exceeded total outlays ($${totalExpenditure}M) by +$${structuralFiscalBalance}M.`);
      } else {
        explanations.push(`Fiscal Deficit Incurred: Expenditures ($${totalExpenditure}M) exceeded tax revenues ($${totalTaxRevenue}M) by -$${Math.abs(structuralFiscalBalance)}M.`);
      }

      const infraShare = alloc.infrastructure / current.gdp;
      const eduShare = alloc.educationRd / current.gdp;
      const healthShare = alloc.healthcareSocial / current.gdp;
      const industryShare = alloc.industrialSubsidies / current.gdp;

      const productiveSpendingImpulse = (infraShare * 1.45 + industryShare * 1.25 + healthShare * 1.05 + eduShare * 0.70) * 100 - 10.0;
      const corpDrag = (alloc.corporateTax - 20) * 0.08 + (alloc.corporateTax > 30 ? (alloc.corporateTax - 30) * 0.10 : 0);
      const incDrag = (alloc.incomeTax - 24) * 0.05;
      const vatDrag = (alloc.vat - 14) * 0.04;
      const totalTaxDrag = corpDrag + incDrag + vatDrag;

      const borrowingShare = alloc.sovereignBorrowing / current.gdp;
      const crowdingOutPenalty = borrowingShare > 0.04 ? (borrowingShare - 0.04) * 28 * (current.debtToGdp > 70 ? 1.5 : 1.0) : 0;

      const newHumanCapital = (eduShare + industryShare * 0.5) * 16 + (shockEffect.humanCapitalDelta || 0);
      const nextHumanCapitalStock = clamp(current.humanCapitalStock + newHumanCapital, 0, 30);

      let delayedEndogenousBonus = 0;
      if (current.round >= 2) {
        delayedEndogenousBonus = Number((current.humanCapitalStock * 0.18).toFixed(1));
        if (delayedEndogenousBonus >= 0.6) {
          explanations.push(`Delayed Endogenous Growth Lag: Past R&D and Education investments yielded +${delayedEndogenousBonus.toFixed(1)}% productivity boost this year.`);
        }
      }

      const rawGdpGrowth = 2.5 + productiveSpendingImpulse * 0.38 - totalTaxDrag - crowdingOutPenalty + delayedEndogenousBonus + (shockEffect.gdpGrowthDelta || 0);
      const nextGdpGrowth = clamp(rawGdpGrowth, -12.0, 15.0);
      const nextGdp = Number((current.gdp * (1 + nextGdpGrowth / 100)).toFixed(1));

      const principalPaid = Math.max(0, alloc.debtServicing - mandatoryInterestDue);
      const nextNominalDebt = Math.max(0, nominalDebt + alloc.sovereignBorrowing - principalPaid);
      const nextDebtToGdp = clamp((nextNominalDebt / nextGdp) * 100 + (shockEffect.debtToGdpDelta || 0), 0, 250);

      const nextInflation = clamp(current.inflation + (nextGdpGrowth - 3.0) * 0.30 + Math.max(0, (alloc.vat - 15) * 0.12) + (shockEffect.inflationDelta || 0), -2.0, 30.0);
      const nextUnemployment = clamp(current.unemployment - (nextGdpGrowth - 2.8) * 0.45 + (shockEffect.unemploymentDelta || 0), 1.2, 35.0);
      const nextApproval = clamp(current.approval + ((healthShare + eduShare) * 100 - 8.0) * 1.2 - (alloc.incomeTax - 22) * 0.22 + (shockEffect.approvalDelta || 0), 5, 98);

      explanations.push(`Historical Crisis Choice [Option ${shockOption.id}]: ${shockOption.rationale}`);

      const nextState = {
        year: current.year + 1,
        round: current.round + 1,
        treasury: nextTreasury,
        initialTreasury: current.initialTreasury,
        gdp: nextGdp,
        gdpGrowth: nextGdpGrowth,
        debtToGdp: nextDebtToGdp,
        inflation: nextInflation,
        unemployment: nextUnemployment,
        approval: nextApproval,
        budgetBalance: structuralFiscalBalance,
        complianceFactor: nextCompliance,
        baseInterestRate: effectiveInterestRate,
        humanCapitalStock: nextHumanCapitalStock,
      };

      const score = Math.round(clamp(50 + (nextTreasury / current.initialTreasury) * 20 + (100 - nextDebtToGdp) * 0.2 + nextGdpGrowth * 2, 10, 100));

      return {
        nextState,
        totalTaxRevenue,
        totalExpenditure,
        fiscalBalance: structuralFiscalBalance,
        capitalDelta,
        capitalDeltaPct,
        fiscalStatus,
        score,
        explanations
      };
    }

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            {/* LEFT: REVENUES */}
            <div className="lg:col-span-3 border border-[#1E1E1E] bg-[#FFFFFF] shadow-brutal">
              <div className="bg-[#E04F3E] text-white p-2 font-mono text-xs font-bold uppercase tracking-wider">
                01. REVENUES & BORROWING
              </div>
              <div className="p-4 space-y-4 font-mono text-xs">
                <div>
                  <div className="flex justify-between font-bold"><span>Corporate Tax</span><span>{allocations.corporateTax}%</span></div>
                  <input type="range" min="10" max="45" value={allocations.corporateTax} onChange={e => setAllocations({...allocations, corporateTax: Number(e.target.value)})} className="w-full accent-[#1E1E1E]" />
                </div>
                <div>
                  <div className="flex justify-between font-bold"><span>Income Tax</span><span>{allocations.incomeTax}%</span></div>
                  <input type="range" min="10" max="50" value={allocations.incomeTax} onChange={e => setAllocations({...allocations, incomeTax: Number(e.target.value)})} className="w-full accent-[#1E1E1E]" />
                </div>
                <div>
                  <div className="flex justify-between font-bold"><span>VAT / Sales Tax</span><span>{allocations.vat}%</span></div>
                  <input type="range" min="5" max="25" value={allocations.vat} onChange={e => setAllocations({...allocations, vat: Number(e.target.value)})} className="w-full accent-[#1E1E1E]" />
                </div>
                <div>
                  <div className="flex justify-between font-bold"><span>Sovereign Borrowing</span><span className="text-[#E04F3E]">${allocations.sovereignBorrowing}M</span></div>
                  <input type="range" min="0" max="1000" step="10" value={allocations.sovereignBorrowing} onChange={e => setAllocations({...allocations, sovereignBorrowing: Number(e.target.value)})} className="w-full accent-[#E04F3E]" />
                </div>
                <div className="pt-2 border-t border-[#1E1E1E] text-[#264653]">
                  <div>Total Tax Receipts: <strong>${preview.totalTaxRevenue}M</strong></div>
                  <div>Total Inflows: <strong>${preview.totalInflows}M</strong></div>
                </div>
              </div>
            </div>

            {/* CENTER: SCORECARD & METRICS */}
            <div className="lg:col-span-6 space-y-4">
              <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-5 shadow-brutal">
                <div className="text-[10px] font-mono uppercase text-[#264653] font-bold">Current National Treasury Capital</div>
                <div className="flex items-baseline justify-between mt-1">
                  <div className="text-4xl font-mono font-extrabold">${currentStats.treasury}M</div>
                  <span className={`px-2 py-0.5 text-xs font-mono font-bold uppercase text-white ${preview.fiscalStatus === 'SURPLUS' ? 'bg-[#2A9D8F]' : 'bg-[#E04F3E]'}`}>
                    {preview.fiscalStatus} (${Math.abs(preview.fiscalBalance)}M)
                  </span>
                </div>

                <div className="grid grid-cols-4 gap-2 mt-4 text-center font-mono text-xs border-t border-[#1E1E1E] pt-3">
                  <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-2">
                    <div className="text-[9px] uppercase">GDP Level</div>
                    <div className="font-bold text-sm">${currentStats.gdp}M</div>
                  </div>
                  <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-2">
                    <div className="text-[9px] uppercase">Growth</div>
                    <div className="font-bold text-sm text-[#2A9D8F]">{currentStats.gdpGrowth}%</div>
                  </div>
                  <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-2">
                    <div className="text-[9px] uppercase">Debt/GDP</div>
                    <div className="font-bold text-sm">{currentStats.debtToGdp}%</div>
                  </div>
                  <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-2">
                    <div className="text-[9px] uppercase">CPI Inflation</div>
                    <div className="font-bold text-sm">{currentStats.inflation}%</div>
                  </div>
                </div>
              </div>

              <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-4 shadow-brutal flex justify-between items-center">
                <span className="font-mono text-xs text-[#264653]">Historical Crisis: <strong>{currentShock.title}</strong></span>
                <button onClick={() => setViewMode('SHOCK_MODAL')} className="bg-[#1E1E1E] text-white font-mono font-bold text-xs uppercase px-5 py-2 shadow-brutal hover:bg-[#264653]">
                  Resolve Crisis Decision →
                </button>
              </div>
            </div>

            {/* RIGHT: EXPENDITURES */}
            <div className="lg:col-span-3 border border-[#1E1E1E] bg-[#FFFFFF] shadow-brutal">
              <div className="bg-[#E04F3E] text-white p-2 font-mono text-xs font-bold uppercase tracking-wider">
                02. EXPENDITURES ($M)
              </div>
              <div className="p-4 space-y-4 font-mono text-xs">
                <div>
                  <div className="flex justify-between font-bold"><span>Infrastructure</span><span>${allocations.infrastructure}M</span></div>
                  <input type="range" min="0" max={currentStats.gdp * 0.25} value={allocations.infrastructure} onChange={e => setAllocations({...allocations, infrastructure: Number(e.target.value)})} className="w-full accent-[#1E1E1E]" />
                </div>
                <div>
                  <div className="flex justify-between font-bold"><span>Education & R&D</span><span className="text-[#2A9D8F]">${allocations.educationRd}M</span></div>
                  <input type="range" min="0" max={currentStats.gdp * 0.20} value={allocations.educationRd} onChange={e => setAllocations({...allocations, educationRd: Number(e.target.value)})} className="w-full accent-[#2A9D8F]" />
                </div>
                <div>
                  <div className="flex justify-between font-bold"><span>Healthcare & Social</span><span>${allocations.healthcareSocial}M</span></div>
                  <input type="range" min="0" max={currentStats.gdp * 0.25} value={allocations.healthcareSocial} onChange={e => setAllocations({...allocations, healthcareSocial: Number(e.target.value)})} className="w-full accent-[#1E1E1E]" />
                </div>
                <div>
                  <div className="flex justify-between font-bold"><span>Debt Servicing</span><span>${allocations.debtServicing}M</span></div>
                  <input type="range" min="0" max={Math.max(preview.mandatoryInterestDue * 2, 200)} value={allocations.debtServicing} onChange={e => setAllocations({...allocations, debtServicing: Number(e.target.value)})} className="w-full accent-[#1E1E1E]" />
                </div>
                <div className="pt-2 border-t border-[#1E1E1E] text-[#264653]">
                  <div>Total Outlays: <strong>${preview.totalExpenditure}M</strong></div>
                  <div>Balance: <strong className={preview.fiscalBalance >= 0 ? 'text-[#2A9D8F]' : 'text-[#E04F3E]'}>${preview.fiscalBalance}M</strong></div>
                </div>
              </div>
            </div>
          </div>

          {/* SHOCK MODAL */}
          {viewMode === 'SHOCK_MODAL' && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white border-2 border-[#1E1E1E] max-w-xl w-full p-6 shadow-brutal-lg space-y-4">
                <div className="bg-[#E04F3E] text-white p-2 font-mono font-bold text-xs uppercase">{currentShock.fiscalYearLabel} • {currentShock.title}</div>
                <p className="font-serif italic text-xs text-[#264653] bg-[#F7F4EB] p-3 border border-[#1E1E1E]">"{currentShock.context}"</p>
                <div className="space-y-2">
                  {currentShock.options.map(opt => (
                    <div key={opt.id} onClick={() => setSelectedShockId(opt.id)} className={`cursor-pointer border border-[#1E1E1E] p-3 text-xs ${selectedShockId === opt.id ? 'bg-[#E9C46A]/30 shadow-brutal font-bold' : ''}`}>
                      <div className="font-mono">[{opt.id}] {opt.label}</div>
                      <div className="text-[#264653] font-normal mt-1">{opt.description}</div>
                    </div>
                  ))}
                </div>
                <div className="flex justify-between pt-2">
                  <button onClick={() => setViewMode('DASHBOARD')} className="border border-[#1E1E1E] px-4 py-2 font-mono text-xs font-bold">← Revise Sliders</button>
                  <button onClick={handleConfirmShock} className="bg-[#1E1E1E] text-white px-6 py-2 font-mono text-xs font-bold uppercase shadow-brutal">Execute Fiscal Year</button>
                </div>
              </div>
            </div>
          )}

          {/* ROUND FEEDBACK */}
          {viewMode === 'ROUND_FEEDBACK' && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white border-2 border-[#1E1E1E] max-w-xl w-full p-6 shadow-brutal-lg space-y-4">
                <div className="bg-[#1E1E1E] text-white p-2 font-mono font-bold text-xs uppercase">Fiscal Year {currentStats.round - 1} Report</div>
                <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-3 font-mono text-xs flex justify-between">
                  <span>Treasury Capital: <strong>${currentStats.treasury}M</strong></span>
                  <span className={currentStats.budgetBalance >= 0 ? 'text-[#2A9D8F] font-bold' : 'text-[#E04F3E] font-bold'}>{currentStats.budgetBalance >= 0 ? 'SURPLUS' : 'DEFICIT'}</span>
                </div>
                <div className="space-y-2 text-xs">
                  {lastRoundExplanations.map((exp, i) => (
                    <div key={i} className="border border-[#1E1E1E] p-2 bg-white flex gap-2">
                      <span className="text-[#2A9D8F] font-bold">✓</span>
                      <span>{exp}</span>
                    </div>
                  ))}
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={handleNext} className="bg-[#1E1E1E] text-white px-6 py-2 font-mono text-xs font-bold uppercase shadow-brutal">
                    {currentStats.round > 5 ? 'View Final Assessment' : `Proceed to FY ${currentStats.round}`} →
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
