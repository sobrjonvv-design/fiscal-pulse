    // ========================================================================
    // 2. ECONOMIC CALCULATION ENGINE
    // ========================================================================
    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, Number(val.toFixed(2))));
    }

    function calculateEffectiveTaxYield(rate, optimalRate, elasticity) {
      const normRate = rate / 100;
      const normOptimal = optimalRate / 100;
      if (normRate <= normOptimal) return normRate;
      const excess = normRate - normOptimal;
      const penalty = Math.pow(excess, 1.55) * elasticity;
      return Math.max(0.03, normRate - penalty);
    }

    function calculateBudgetPreview(current, alloc) {
      const compliance = current.complianceFactor;
      const corpEff = calculateEffectiveTaxYield(alloc.corporateTax, 22, 1.35);
      const incEff = calculateEffectiveTaxYield(alloc.incomeTax, 28, 1.20);
      const vatEff = calculateEffectiveTaxYield(alloc.vat, 16, 1.15);

      const corpRev = current.gdp * 0.25 * corpEff * compliance;
      const incRev = current.gdp * 0.40 * incEff * compliance;
      const vatRev = current.gdp * 0.35 * vatEff * compliance;

      const totalTaxRevenue = Number((corpRev + incRev + vatRev).toFixed(1));
      const totalInflows = Number((totalTaxRevenue + alloc.sovereignBorrowing).toFixed(1));

      const nominalDebt = (current.debtToGdp / 100) * current.gdp;
      const debtRiskPremium = current.debtToGdp > 90 ? (current.debtToGdp - 90) * 0.075 : current.debtToGdp > 60 ? (current.debtToGdp - 60) * 0.030 : 0;
      const effectiveInterestRate = clamp(current.baseInterestRate + debtRiskPremium, 1.5, 18.0);
      const mandatoryInterestDue = Number(((nominalDebt * (effectiveInterestRate / 100)) * 0.50).toFixed(1));

      const totalExpenditure = Number((alloc.infrastructure + alloc.educationRd + alloc.healthcareSocial + alloc.industrialSubsidies + alloc.debtServicing).toFixed(1));
      const fiscalBalance = Number((totalTaxRevenue - totalExpenditure).toFixed(1));

      return {
        totalTaxRevenue,
        totalInflows,
        totalExpenditure,
        mandatoryInterestDue,
        effectiveInterestRate,
        fiscalBalance,
        fiscalStatus: fiscalBalance >= 0 ? 'SURPLUS' : 'DEFICIT'
      };
    }

    function simulateFiscalRound(current, alloc, shockOption) {
      const shockEffect = shockOption.effects;
      const explanations = [];

      const nextCompliance = clamp(current.complianceFactor + (shockEffect.complianceDelta || 0), 0.60, 1.08);

      const corpEff = calculateEffectiveTaxYield(alloc.corporateTax, 22, 1.35);
      const incEff = calculateEffectiveTaxYield(alloc.incomeTax, 28, 1.20);
      const vatEff = calculateEffectiveTaxYield(alloc.vat, 16, 1.15);

      const corpRev = current.gdp * 0.25 * corpEff * nextCompliance;
      const incRev = current.gdp * 0.40 * incEff * nextCompliance;
      const vatRev = current.gdp * 0.35 * vatEff * nextCompliance;

      const totalTaxRevenue = Number((corpRev + incRev + vatRev).toFixed(1));
      const totalInflows = Number((totalTaxRevenue + alloc.sovereignBorrowing).toFixed(1));

      const nominalDebt = (current.debtToGdp / 100) * current.gdp;
      const debtRiskPremium = current.debtToGdp > 90 ? (current.debtToGdp - 90) * 0.075 : current.debtToGdp > 60 ? (current.debtToGdp - 60) * 0.030 : 0;
      const effectiveInterestRate = clamp(current.baseInterestRate + debtRiskPremium, 1.5, 18.0);
      const mandatoryInterestDue = Number(((nominalDebt * (effectiveInterestRate / 100)) * 0.50).toFixed(1));

      const totalExpenditure = Number((alloc.infrastructure + alloc.educationRd + alloc.healthcareSocial + alloc.industrialSubsidies + alloc.debtServicing).toFixed(1));

      const liquidCashDelta = Number((totalInflows - totalExpenditure + (shockEffect.treasuryDelta || 0)).toFixed(1));
      const nextTreasury = Number((current.treasury + liquidCashDelta).toFixed(1));
      const capitalDelta = Number((nextTreasury - current.treasury).toFixed(1));
      const capitalDeltaPct = Number(((capitalDelta / Math.max(1, current.treasury)) * 100).toFixed(1));

      const structuralFiscalBalance = Number((totalTaxRevenue - totalExpenditure).toFixed(1));
      const fiscalStatus = structuralFiscalBalance >= 0 ? 'SURPLUS' : 'DEFICIT';

      if (fiscalStatus === 'SURPLUS') {
        explanations.push(`Fiscal Surplus: Tax receipts ($${totalTaxRevenue}M) exceeded outlays ($${totalExpenditure}M) by +$${structuralFiscalBalance}M.`);
      } else {
        explanations.push(`Fiscal Deficit: Outlays ($${totalExpenditure}M) exceeded tax revenue ($${totalTaxRevenue}M) by -$${Math.abs(structuralFiscalBalance)}M.`);
      }

      const infraShare = alloc.infrastructure / current.gdp;
      const eduShare = alloc.educationRd / current.gdp;
      const healthShare = alloc.healthcareSocial / current.gdp;
      const industryShare = alloc.industrialSubsidies / current.gdp;

      const productiveSpendingImpulse = (infraShare * 1.45 + industryShare * 1.25 + healthShare * 1.05 + eduShare * 0.70) * 100 - 10.0;
      const corpDrag = (alloc.corporateTax - 20) * 0.08 + (alloc.corporateTax > 30 ? (alloc.corporateTax - 30) * 0.10 : 0);
      const incDrag = (alloc.incomeTax - 24) * 0.05;
      const vatDrag = (alloc.vat - 14) * 0.04;
      const totalTaxDrag = corpDrag + incDrag + vatDrag;

      const borrowingShare = alloc.sovereignBorrowing / current.gdp;
      const crowdingOutPenalty = borrowingShare > 0.04 ? (borrowingShare - 0.04) * 28 * (current.debtToGdp > 70 ? 1.5 : 1.0) : 0;

      const newHumanCapital = (eduShare + industryShare * 0.5) * 16 + (shockEffect.humanCapitalDelta || 0);
      const nextHumanCapitalStock = clamp(current.humanCapitalStock + newHumanCapital, 0, 30);

      let delayedEndogenousBonus = 0;
      if (current.round >= 2) {
        delayedEndogenousBonus = Number((current.humanCapitalStock * 0.18).toFixed(1));
        if (delayedEndogenousBonus >= 0.6) {
          explanations.push(`Endogenous Growth Lag: Past R&D and Education investments yielded +${delayedEndogenousBonus.toFixed(1)}% productivity boost this year.`);
        }
      }

      const rawGdpGrowth = 2.5 + productiveSpendingImpulse * 0.38 - totalTaxDrag - crowdingOutPenalty + delayedEndogenousBonus + (shockEffect.gdpGrowthDelta || 0);
      const nextGdpGrowth = clamp(rawGdpGrowth, -12.0, 15.0);
      const nextGdp = Number((current.gdp * (1 + nextGdpGrowth / 100)).toFixed(1));

      const principalPaid = Math.max(0, alloc.debtServicing - mandatoryInterestDue);
      const nextNominalDebt = Math.max(0, nominalDebt + alloc.sovereignBorrowing - principalPaid);
      const nextDebtToGdp = clamp((nextNominalDebt / nextGdp) * 100 + (shockEffect.debtToGdpDelta || 0), 0, 250);

      const nextInflation = clamp(current.inflation + (nextGdpGrowth - 3.0) * 0.30 + Math.max(0, (alloc.vat - 15) * 0.12) + (shockEffect.inflationDelta || 0), -2.0, 30.0);
      const nextUnemployment = clamp(current.unemployment - (nextGdpGrowth - 2.8) * 0.45 + (shockEffect.unemploymentDelta || 0), 1.2, 35.0);
      const nextApproval = clamp(current.approval + ((healthShare + eduShare) * 100 - 8.0) * 1.2 - (alloc.incomeTax - 22) * 0.22 + (shockEffect.approvalDelta || 0), 5, 98);

      explanations.push(`Crisis Policy Decision [${shockOption.id}]: ${shockOption.rationale}`);

      const nextState = {
        year: current.year + 1,
        round: current.round + 1,
        treasury: nextTreasury,
        initialTreasury: current.initialTreasury,
        gdp: nextGdp,
        gdpGrowth: nextGdpGrowth,
        debtToGdp: nextDebtToGdp,
        inflation: nextInflation,
        unemployment: nextUnemployment,
        approval: nextApproval,
        budgetBalance: structuralFiscalBalance,
        complianceFactor: nextCompliance,
        baseInterestRate: effectiveInterestRate,
        humanCapitalStock: nextHumanCapitalStock,
      };

      const capitalGrowthPct = Number((((nextTreasury - current.initialTreasury) / current.initialTreasury) * 100).toFixed(1));

      return {
        nextState,
        totalTaxRevenue,
        totalExpenditure,
        fiscalBalance: structuralFiscalBalance,
        capitalDelta,
        capitalDeltaPct,
        capitalGrowthPct,
        fiscalStatus,
        explanations
      };
    }

    // ========================================================================

          savedId = localStorage.getItem('fp_device_profile_id_v3');
        } catch (e) {}

          } catch (e) {}
        }

          if (n) return n;
        } catch (e) {}

      });

      const [viewMode, setViewMode] = useState('LOBBY');

      const [correctAnswersCount, setCorrectAnswersCount] = useState(0);

      // Shared Cohort Teams Dictionary
      const [teamsMap, setTeamsMap] = useState({});
      const [cloudConnected, setCloudConnected] = useState(false);

      const currentShock = selectedCase.rounds[Math.min(currentStats.round - 1, selectedCase.rounds.length - 1)];
      const preview = useMemo(() => calculateBudgetPreview(currentStats, allocations), [currentStats, allocations]);

      const mqttClientRef = useRef(null);
      const bcRef = useRef(null);

      // --- BROADCAST FUNCTION ---
      const broadcastTeamState = (overrideFields = {}) => {
        const cleanRoom = (roomCode || '482-910').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const mqttTopic = `fiscal_pulse_v4/room_${cleanRoom}`;
        const storageKey = `fp_teams_storage_v4_${cleanRoom}`;

        const growth = Number((((currentStats.treasury - currentStats.initialTreasury) / currentStats.initialTreasury) * 100).toFixed(1));

        const myTeamPayload = {
          id: myId,
          name: teamName || 'Unnamed Team',
          roomCode: cleanRoom,
          countryName: selectedCase.name,
          round: currentStats.round,
          treasury: currentStats.treasury,
          capitalGrowthPct: growth,
          correctAnswers: correctAnswersCount,
          debtToGdp: currentStats.debtToGdp,
          gdpGrowth: currentStats.gdpGrowth,
          status: currentStats.budgetBalance >= 0 ? 'SURPLUS' : 'DEFICIT',
          lastActive: Date.now(),
          ...overrideFields
        };

        // Update local state and purge any ghost teams inactive > 18 seconds
        setTeamsMap((prev) => {
          const now = Date.now();
          const next = {};
          // Keep active teams only
          Object.keys(prev).forEach((k) => {
            if (now - (prev[k].lastActive || 0) < 18000) {
              next[k] = prev[k];
            }
          });
          next[myTeamPayload.id] = myTeamPayload;
          try {
            localStorage.setItem(storageKey, JSON.stringify(next));
          } catch (e) {}
          return next;
        });

        // Broadcast via BroadcastChannel
        if (bcRef.current) {
          try {
            bcRef.current.postMessage({ type: 'TEAM_SYNC', team: myTeamPayload });
          } catch (e) {}
        }

        // Broadcast via HiveMQ Cloud WebSocket
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          try {
            mqttClientRef.current.publish(mqttTopic, JSON.stringify({ type: 'TEAM_SYNC', team: myTeamPayload }));
          } catch (e) {}
        }
      };

      // --- GLOBAL REAL-TIME CLOUD MQTT & BROADCASTCHANNEL SYNC ---
      useEffect(() => {
        const cleanRoom = (roomCode || '482-910').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const mqttTopic = `fiscal_pulse_v4/room_${cleanRoom}`;
        const storageKey = `fp_teams_storage_v4_${cleanRoom}`;

        // 1. Load LocalStorage Cache (pruning old dead sessions)
        try {
          const cached = localStorage.getItem(storageKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            const now = Date.now();
            const fresh = {};
            Object.keys(parsed).forEach(k => {
              if (now - (parsed[k].lastActive || 0) < 18000) {
                fresh[k] = parsed[k];
              }
            });
            setTeamsMap(fresh);
          }
        } catch (e) {}

        // 2. Setup BroadcastChannel for Same-Browser Tabs
        try {
          bcRef.current = new BroadcastChannel(`fp_bc_v4_${cleanRoom}`);
          bcRef.current.onmessage = (event) => {
            if (event.data && event.data.type === 'TEAM_SYNC' && event.data.team) {
              mergeTeam(event.data.team);
            }
          };
        } catch (e) {}

        // 3. Connect to HiveMQ Public WebSocket Broker
        try {
          if (window.mqtt) {
            const client = window.mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
              clientId: 'fp4_' + myId + '_' + Math.random().toString(16).substr(2, 6),
              clean: true,
              keepalive: 25,
              reconnectPeriod: 2000,
            });

            mqttClientRef.current = client;

            client.on('connect', () => {
              setCloudConnected(true);
              client.subscribe(mqttTopic, { qos: 0 });
              broadcastTeamState();
            });

            client.on('message', (topic, payload) => {
              try {
                const parsed = JSON.parse(payload.toString());
                if (parsed.type === 'TEAM_SYNC' && parsed.team) {
                  mergeTeam(parsed.team);
                }
              } catch (err) {}
            });

            client.on('offline', () => setCloudConnected(false));
            client.on('error', () => setCloudConnected(false));
          }
        } catch (e) {}

        const handleStorage = (e) => {
          if (e.key === storageKey && e.newValue) {
            try {
              setTeamsMap(JSON.parse(e.newValue));
            } catch (err) {}
          }
        };
        window.addEventListener('storage', handleStorage);

        return () => {
          if (bcRef.current) bcRef.current.close();
          if (mqttClientRef.current) mqttClientRef.current.end(true);
          window.removeEventListener('storage', handleStorage);
        };
      }, [roomCode, myId]);

      // Merge team helper
      const mergeTeam = (team) => {
        setTeamsMap((prev) => {
          const next = { ...prev, [team.id]: team };
          const cleanRoom = (roomCode || '482-910').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

      useEffect(() => {
        broadcastTeamState();

          countryName: cCase.name,

          gdp: cCase.initialStats.gdp,
          debtToGdp: cCase.initialStats.debtToGdp,

        const val = e.target.value;
        setTeamName(val);
        try {
          localStorage.setItem('fp_profile_team_name_v3', val);

        broadcastTeamState({ name: val });

      // 3. Start Game
      const startGame = () => {
        broadcastTeamState({ round: 1 });
        setViewMode('DASHBOARD');
      };

      // 4. Execute Fiscal Round & Check Optimal Policy Answer
      const handleConfirmShock = () => {
        const option = currentShock.options.find(o => o.id === selectedShockId) || currentShock.options[0];
        const isOptimal = selectedShockId === currentShock.optimalOptionId;
        const newCorrectCount = isOptimal ? correctAnswersCount + 1 : correctAnswersCount;

        setWasLastOptimal(isOptimal);
        setCorrectAnswersCount(newCorrectCount);

        const res = simulateFiscalRound(currentStats, allocations, option);
        setCurrentStats(res.nextState);
        setHistory(prev => [...prev, res.nextState]);
        setLastRoundExplanations(res.explanations);

        broadcastTeamState({
          round: res.nextState.round,
          treasury: res.nextState.treasury,
          capitalGrowthPct: res.capitalGrowthPct,
          correctAnswers: newCorrectCount,
          debtToGdp: res.nextState.debtToGdp,
          gdpGrowth: res.nextState.gdpGrowth,
          status: res.fiscalStatus

        setViewMode('ROUND_FEEDBACK');
      };

      const handleNext = () => {
        if (currentStats.round > 5) {
          setViewMode('FINAL_DEBRIEF');
        } else {
          setSelectedShockId('A');
          setViewMode('DASHBOARD');
        }

      // Leaderboard Ranking: Clean list without phantom duplicates!
      const sortedTeams = useMemo(() => {
        const now = Date.now();
        // Filter out any team with no heartbeat in the last 18 seconds
        const activeList = Object.values(teamsMap).filter(t => t.id === myId || (now - (t.lastActive || 0) < 18000));

        // Ensure current user is always present with latest active values
        const growth = Number((((currentStats.treasury - currentStats.initialTreasury) / currentStats.initialTreasury) * 100).toFixed(1));
        const myTeamObj = {
          id: myId,
          name: teamName || 'Unnamed Team',
          countryName: selectedCase.name,
          round: currentStats.round,
          treasury: currentStats.treasury,
          capitalGrowthPct: growth,
          correctAnswers: correctAnswersCount,
          debtToGdp: currentStats.debtToGdp,
          status: currentStats.budgetBalance >= 0 ? 'SURPLUS' : 'DEFICIT',
          lastActive: now
        };

        const mapWithoutMe = activeList.filter(t => t.id !== myId);
        const finalList = [myTeamObj, ...mapWithoutMe];

        return finalList.sort((a, b) => {
          if ((b.correctAnswers || 0) !== (a.correctAnswers || 0)) {
            return (b.correctAnswers || 0) - (a.correctAnswers || 0);
          }
          return (b.capitalGrowthPct || 0) - (a.capitalGrowthPct || 0);

        if (correct === 4) return 'A (Master Macroeconomist)';
        if (correct === 3) return 'B (Competent Technocrat)';
        if (correct === 2) return 'C (Fiscal Muddler)';
        return 'D (Sovereign Distress)';

                      <div>

                          {team.correctAnswers || 0} / 5 Correct Choices

                        <span className={`text-[9px] font-bold px-1.5 py-0.5 uppercase text-white ${

                          {team.status || 'SURPLUS'}
                        </span>
                      </div>
                      <div className="text-[11px] text-[#264653] font-bold">
                        Treasury: ${team.treasury}M ({Number(team.capitalGrowthPct) >= 0 ? '+' : ''}{team.capitalGrowthPct}%)

            <button

              className="bg-[#1E1E1E] text-white font-mono font-bold text-xs uppercase px-6 py-2.5 shadow-brutal hover:bg-[#264653] transition"
            >
              ← Return to Lobby & Select New Country
            </button>
          </div>
        );
      }

      // ======================================================================
      // RENDER: DASHBOARD VIEW (100% STRICT ENGLISH BENTO GRID)
      // ======================================================================
      return (
        <div className="max-w-7xl mx-auto p-3 md:p-4 space-y-4">
          {/* Header Strip */}
          <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-3 shadow-brutal flex flex-wrap justify-between items-center gap-3">
            <div className="flex items-center gap-3">
              <span className="bg-[#E04F3E] text-white px-2 py-0.5 font-mono font-bold text-xs">CASE {selectedCase.codeNumber}</span>
              <span className="font-mono font-bold text-xs text-[#1E1E1E]">{selectedCase.name}: {selectedCase.subtitle}</span>
              <span className="text-xs font-mono text-[#264653] hidden sm:inline">| Team: <strong>{teamName}</strong> (Room {roomCode})</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="bg-[#E9C46A] border border-[#1E1E1E] px-2.5 py-1 font-mono text-xs font-bold text-[#1E1E1E]">
                OPTIMAL CHOICES: {correctAnswersCount} / 5
              </span>
              <span className="bg-[#F7F4EB] border border-[#1E1E1E] px-3 py-1 font-mono text-xs font-bold text-[#1E1E1E]">
                FISCAL YEAR {currentStats.round} OF 5 ({currentShock.fiscalYearLabel})
              </span>
            </div>
          </div>

          {/* 3-Column Bento Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">

            <div className="lg:col-span-3 border border-[#1E1E1E] bg-[#FFFFFF] shadow-brutal flex flex-col justify-between">

                    <div className="flex justify-between font-bold"><span>Infrastructure</span><span>${allocations.infrastructure}M</span></div>
                    <input type="range" min="0" max={currentStats.gdp * 0.25} value={allocations.infrastructure} onChange={e => setAllocations({...allocations, infrastructure: Number(e.target.value)})} className="w-full accent-[#1E1E1E] cursor-pointer" />
                    <div className="text-[10px] text-[#264653]">High Keynesian multiplier (1.45x).</div>
                  </div>
                  <div>
                    <div className="flex justify-between font-bold"><span>Education & R&D</span><span className="text-[#2A9D8F] font-bold">${allocations.educationRd}M</span></div>
                    <input type="range" min="0" max={currentStats.gdp * 0.20} value={allocations.educationRd} onChange={e => setAllocations({...allocations, educationRd: Number(e.target.value)})} className="w-full accent-[#2A9D8F] cursor-pointer" />
                    <div className="text-[10px] text-[#264653]">Endogenous growth lag unlocks in Rounds 3–5.</div>
                  </div>
                  <div>
                    <div className="flex justify-between font-bold"><span>Healthcare & Social</span><span>${allocations.healthcareSocial}M</span></div>
                    <input type="range" min="0" max={currentStats.gdp * 0.25} value={allocations.healthcareSocial} onChange={e => setAllocations({...allocations, healthcareSocial: Number(e.target.value)})} className="w-full accent-[#1E1E1E] cursor-pointer" />
                    <div className="text-[10px] text-[#264653]">Protects approval and social stability.</div>
                  </div>
                  <div>
                    <div className="flex justify-between font-bold"><span>Debt Servicing</span><span className={allocations.debtServicing < preview.mandatoryInterestDue ? 'text-[#E04F3E]' : 'text-[#2A9D8F]'}>${allocations.debtServicing}M</span></div>
                    <input type="range" min="0" max={Math.max(preview.mandatoryInterestDue * 2, 200)} value={allocations.debtServicing} onChange={e => setAllocations({...allocations, debtServicing: Number(e.target.value)})} className="w-full accent-[#1E1E1E] cursor-pointer" />
                    <div className="text-[10px] text-[#264653]">Required Interest: ${preview.mandatoryInterestDue}M.</div>
                  </div>
                </div>
              </div>

              <div className="p-3 bg-[#F7F4EB] border-t border-[#1E1E1E] font-mono text-xs space-y-1">
                <div className="flex justify-between text-[#264653]"><span>Total Outlays:</span><span className="font-bold text-[#E04F3E]">${preview.totalExpenditure}M</span></div>
                <div className="flex justify-between text-[#264653]"><span>Fiscal Balance:</span><span className={`font-bold ${preview.fiscalBalance >= 0 ? 'text-[#2A9D8F]' : 'text-[#E04F3E]'}`}>{preview.fiscalBalance >= 0 ? '+' : ''}${preview.fiscalBalance}M</span></div>
              </div>
            </div>
          </div>

          {/* LIVE COHORT STANDINGS STRIP (RANKED BY OPTIMAL ANSWERS) */}
          <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-4 shadow-brutal">
            <div className="flex justify-between items-center border-b border-[#1E1E1E] pb-2 mb-3">
              <span className="font-mono font-bold text-xs uppercase text-[#1E1E1E]">
                📊 Live Classroom Cohort Standings (Room {roomCode})
              </span>
              <span className="text-[10px] font-mono text-[#264653]">
                Ranked by: Optimal Economic Choices (out of 5) → Capital Growth %
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 font-mono text-xs">
              {sortedTeams.map((team, idx) => (
                <div
                  key={team.id}
                  className={`border border-[#1E1E1E] p-2 flex justify-between items-center ${
                    team.id === myId ? 'bg-[#E9C46A]/25 ring-1 ring-[#1E1E1E]' : 'bg-[#F7F4EB]'
                  }`}
                >
                  <div>
                    <div className="font-bold text-[#1E1E1E]">
                      #{idx + 1} {team.name} {team.id === myId && '(You)'}
                    </div>
                    <div className="text-[10px] text-[#264653]">
                      RD {team.round || 1} • {team.correctAnswers || 0}/5 Optimal
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="font-extrabold text-[#1E1E1E]">
                      {Number(team.capitalGrowthPct) >= 0 ? '+' : ''}{team.capitalGrowthPct || 0}%
                    </div>
                    <span className={`text-[9px] font-bold px-1 uppercase text-white ${
                      team.status === 'SURPLUS' ? 'bg-[#2A9D8F]' : 'bg-[#E04F3E]'
                    }`}>
                      {team.status || 'SURPLUS'}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* SHOCK MODAL */}
          {viewMode === 'SHOCK_MODAL' && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white border-2 border-[#1E1E1E] max-w-xl w-full p-6 shadow-brutal-lg space-y-4">
                <div className="bg-[#E04F3E] text-white p-2.5 font-mono font-bold text-xs uppercase">
                  {currentShock.fiscalYearLabel} • {currentShock.title}
                </div>
                <p className="font-serif italic text-xs text-[#264653] bg-[#F7F4EB] p-3 border border-[#1E1E1E]">
                  "{currentShock.context}"
                </p>
                <div className="space-y-2">
                  {currentShock.options.map(opt => (
                    <div
                      key={opt.id}
                      onClick={() => setSelectedShockId(opt.id)}
                      className={`cursor-pointer border border-[#1E1E1E] p-3 text-xs transition ${
                        selectedShockId === opt.id ? 'bg-[#E9C46A]/30 shadow-brutal font-bold ring-1 ring-[#1E1E1E]' : 'hover:bg-[#FAF8F2]'
                      }`}
                    >
                      <div className="font-mono text-[#1E1E1E]">[{opt.id}] {opt.label}</div>
                      <div className="text-[#264653] font-normal mt-1 leading-relaxed">{opt.description}</div>
                    </div>
                  ))}
                </div>
                <div className="flex justify-between pt-2 border-t border-[#1E1E1E]">
                  <button onClick={() => setViewMode('DASHBOARD')} className="border border-[#1E1E1E] px-4 py-2 font-mono text-xs font-bold uppercase hover:bg-slate-100">
                    ← Revise Budget Sliders
                  </button>
                  <button onClick={handleConfirmShock} className="bg-[#1E1E1E] text-white px-6 py-2 font-mono text-xs font-bold uppercase shadow-brutal hover:bg-[#264653]">
                    Execute Fiscal Decision →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ROUND FEEDBACK REPORT */}
          {viewMode === 'ROUND_FEEDBACK' && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white border-2 border-[#1E1E1E] max-w-xl w-full p-6 shadow-brutal-lg space-y-4">
                <div className="bg-[#1E1E1E] text-white p-2.5 font-mono font-bold text-xs uppercase flex justify-between">
                  <span>Fiscal Year {currentStats.round - 1} Macroeconomic Report</span>
                  <span className={wasLastOptimal ? 'text-[#2A9D8F]' : 'text-amber-400'}>
                    {wasLastOptimal ? '★ Optimal Choice (+1 Point)' : '▲ Suboptimal Policy (0 Points)'}
                  </span>
                </div>
                <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-3 font-mono text-xs flex justify-between items-center">
                  <div>
                    <span className="text-[#264653] uppercase text-[10px]">Optimal Decisions:</span>
                    <div className="text-xl font-extrabold text-[#1E1E1E]">
                      {correctAnswersCount} / 5 Correct
                    </div>
                  </div>
                  <div className="text-right">
                    <span className="text-[#264653] uppercase text-[10px]">Treasury Capital:</span>
                    <div className="text-xl font-extrabold text-[#2A9D8F]">${currentStats.treasury}M</div>
                  </div>
                </div>
                <div className="space-y-2 text-xs">
                  {lastRoundExplanations.map((exp, i) => (
                    <div key={i} className="border border-[#1E1E1E] p-2.5 bg-white flex gap-2 items-start leading-relaxed">
                      <span className="text-[#2A9D8F] font-bold text-sm">✓</span>
                      <span>{exp}</span>
                    </div>
                  ))}
                </div>
                <div className="flex justify-end pt-2 border-t border-[#1E1E1E]">
                  <button onClick={handleNext} className="bg-[#1E1E1E] text-white px-6 py-2 font-mono text-xs font-bold uppercase shadow-brutal hover:bg-[#264653]">
                    {currentStats.round > 5 ? 'View Final Assessment & Leaderboard' : `Proceed to Fiscal Year ${currentStats.round}`} →
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
