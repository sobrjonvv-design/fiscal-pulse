    let currentSlideIdx = 0;
    let showNotes = false;

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= SLIDES.length) idx = SLIDES.length - 1;
      currentSlideIdx = idx;

      const slide = SLIDES[currentSlideIdx];

      // Update Header & Indicator
      document.getElementById('slideIndicator').innerText = `${String(idx + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
      document.getElementById('progressBar').style.width = `${((idx + 1) / SLIDES.length) * 100}%`;
      document.getElementById('slideTitleMini').innerText = `${idx + 1}. ${slide.title}`;

      // Keep URL synced with current slide for easy refreshing/sharing
      try {
        const url = new URL(window.location);
        url.searchParams.set('slide', idx + 1);
        window.history.replaceState({}, '', url);
      } catch (e) {}

      // Update Nav Buttons
      document.getElementById('prevBtn').disabled = (idx === 0);
      document.getElementById('prevBtn').classList.toggle('opacity-40', idx === 0);
      document.getElementById('nextBtn').innerText = (idx === SLIDES.length - 1) ? 'Play Game 🚀' : 'Next →';

      // Update Speaker Notes Content
      document.getElementById('speakerNotesContent').innerText = slide.notes;

      // Render Stage HTML
      const container = document.getElementById('slideContainer');
      container.innerHTML = `
        <div class="slide-enter w-full bg-[#FFFFFF] border-2 border-[#1E1E1E] shadow-brutal-lg p-4 sm:p-6 space-y-4 my-auto">
          <!-- Slide Header Strip -->
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b-2 border-[#1E1E1E] pb-3">
            <div>
              <span class="bg-[#1E1E1E] text-white px-2 py-0.5 text-xs font-mono font-bold uppercase tracking-wider">
                ${slide.badge}
              </span>
              <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold uppercase mt-1.5 text-[#1E1E1E] tracking-tight">
                ${slide.title}
              </h2>
              <p class="text-xs md:text-sm text-[#264653] font-mono mt-0.5">
                ${slide.subtitle}
              </p>
            </div>
          </div>

          <!-- Slide Body: Content Left, Visual Illustration Right -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
            <!-- Left: Rich Content -->
            <div class="lg:col-span-7 space-y-3.5">
              ${slide.contentHtml}
            </div>

            <!-- Right: Authentic Visual Illustration -->
            <div class="lg:col-span-5">
              <div class="border-2 border-[#1E1E1E] bg-[#F7F4EB] p-2 shadow-brutal">
                <div class="overflow-hidden border border-[#1E1E1E] bg-slate-200 h-44 sm:h-52 md:h-60 relative">
                  <img 
                    src="${slide.image}" 
                    alt="${slide.title}" 
                    class="w-full h-full object-cover transition duration-500 hover:scale-105"
                    loading="lazy"
                  />
                </div>
                <div class="text-[10px] font-mono text-[#264653] mt-1.5 italic px-1 leading-snug">
                  📸 ${slide.imageCaption}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      // Typeset mathematical formulas
      applyMath(container);
    }

    function applyMath(target) {
      const render = () => {
        if (window.renderMathInElement) {
          try {
            renderMathInElement(target, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false
            });
          } catch (e) {
            console.error('KaTeX rendering error:', e);
          }
        }
      };

      if (window.renderMathInElement) {
        render();
      } else {
        setTimeout(render, 150);
        setTimeout(render, 500);
      }
    }

    function nextSlide() {
      if (currentSlideIdx === SLIDES.length - 1) {
        window.location.href = './index.html';
      } else {
        renderSlide(currentSlideIdx + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        renderSlide(currentSlideIdx - 1);
      }
    }

    function toggleSpeakerNotes() {
      showNotes = !showNotes;
      const drawer = document.getElementById('speakerNotesDrawer');
      drawer.classList.toggle('hidden', !showNotes);
      document.getElementById('notesBtnLabel').innerText = showNotes ? 'Hide Notes (N)' : 'Speaker Notes (N)';
    }

    function toggleIndexModal() {
      const modal = document.getElementById('indexModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        // Build Index Grid
        const grid = document.getElementById('indexGrid');
        grid.innerHTML = SLIDES.map((s, i) => `
          <button onclick="jumpToSlide(${i})" class="text-left p-2.5 border border-[#1E1E1E] ${i === currentSlideIdx ? 'bg-[#E9C46A] font-bold' : 'bg-white hover:bg-[#FAF8F2]'}">
            <div class="text-[10px] text-[#E04F3E] font-bold">SLIDE ${String(i + 1).padStart(2, '0')} • ${s.badge}</div>
            <div class="text-xs truncate text-[#1E1E1E] font-semibold">${s.title}</div>
          </button>
        `).join('');
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function jumpToSlide(idx) {
      renderSlide(idx);
      toggleIndexModal();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // Don't intercept if an input is focused
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'n') {
        e.preventDefault();
        toggleSpeakerNotes();
      } else if (e.key.toLowerCase() === 'g') {
        e.preventDefault();
        toggleIndexModal();
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.key === 'Escape') {
        document.getElementById('indexModal').classList.add('hidden');
      }
    });

    // Touch Swipe Navigation for Tablets/Mobiles
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextSlide();
      if (touchEndX > touchStartX + 50) prevSlide();
    }, false);

    // Initial render (respect ?slide= query parameter)
    const urlParams = new URLSearchParams(window.location.search);
    const startSlide = Math.max(0, Math.min(SLIDES.length - 1, (parseInt(urlParams.get('slide'), 10) || 1) - 1));
    renderSlide(startSlide);
  </script>
</body>
