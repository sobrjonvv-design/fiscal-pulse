<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FISCAL PULSE: National Budget & Macroeconomic Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Global Real-Time Cloud MQTT WebSocket Broker -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Historical Cases & Simulation Engine -->
  <script src="cases.js"></script>
  <script src="engine.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#F7F4EB',
            card: '#FFFFFF',
            charcoal: '#1E1E1E',
            terracotta: '#E04F3E',
            teal: '#2A9D8F',
            mustard: '#E9C46A',
            navy: '#264653',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'brutal': '2px 2px 0px #1E1E1E',
            'brutal-lg': '4px 4px 0px #1E1E1E',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F7F4EB; color: #1E1E1E; }
    /* Custom styling for range sliders */
    input[type=range] {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 2px;
      background: #E5E7EB;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 0;
      background: #1E1E1E;
      border: 1px solid #1E1E1E;
      cursor: pointer;
      box-shadow: 1px 1px 0px #000;
    }
    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 0;
      background: #1E1E1E;
      border: 1px solid #1E1E1E;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-[#F7F4EB] text-[#1E1E1E] antialiased selection:bg-[#E9C46A]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Load cases and engine from window globals
    const FP_CASES = window.FP_CASES || [];
    const FP_ENGINE = window.FP_ENGINE || {};

    function App() {
      // 1. Persistent Unique Device/Profile ID
      const [myId] = useState(() => {
        let savedId = null;
        try { savedId = localStorage.getItem('fp_device_profile_id_v5'); } catch (e) {}
        if (!savedId) {
          savedId = 'team_' + Math.random().toString(36).substr(2, 7);
          try { localStorage.setItem('fp_device_profile_id_v5', savedId); } catch (e) {}
        }
        return savedId;
      });

      // 2. Persistent Team Name
      const [teamName, setTeamName] = useState(() => {
        try {
          const n = localStorage.getItem('fp_profile_team_name_v5');
          if (n) return n;
        } catch (e) {}
        return 'Team Alpha: Treasury';
      });

      const [viewMode, setViewMode] = useState('LOBBY'); // LOBBY | DASHBOARD | ROUND_FEEDBACK | FINAL_DEBRIEF
      const [roomCode, setRoomCode] = useState('482-910');
      const [selectedCaseId, setSelectedCaseId] = useState(FP_CASES[0]?.id || 'singapore_1965');
      const selectedCase = useMemo(() => FP_CASES.find(c => c.id === selectedCaseId) || FP_CASES[0], [selectedCaseId]);

      // Simulation States
      const [currentStats, setCurrentStats] = useState(() => selectedCase ? { ...selectedCase.initialStats } : {});
      const [sliders, setSliders] = useState(() => selectedCase ? { ...selectedCase.startSliders } : {});
      const [selectedOptionId, setSelectedOptionId] = useState('A');
      const [activeContextTab, setActiveContextTab] = useState('DOSSIER'); // DOSSIER | FACTS

      // Cumulative Scoring: Sum across 5 rounds out of 500%
      const [roundScores, setRoundScores] = useState([]); // [{ round: 1, optionScore: 50, sliderScore: 40, totalPercent: 90 }]
      const [lastRoundReport, setLastRoundReport] = useState(null);

      // Shared Cohort Teams Dictionary
      const [teamsMap, setTeamsMap] = useState({});
      const [cloudConnected, setCloudConnected] = useState(false);

      const currentRoundIndex = Math.min((currentStats.round || 1) - 1, (selectedCase?.rounds?.length || 1) - 1);
      const currentRound = selectedCase?.rounds ? selectedCase.rounds[currentRoundIndex] : null;

      // Cumulative percentage score out of 500%
      const totalScorePercent = useMemo(() => {
        return roundScores.reduce((acc, r) => acc + (r.roundTotalPercent || 0), 0);
      }, [roundScores]);

      // Real-time Budget Preview
      const budgetPreview = useMemo(() => {
        if (!FP_ENGINE.calculateBudgetPreview || !selectedCase) return {};
        return FP_ENGINE.calculateBudgetPreview(currentStats, sliders, selectedCase);
      }, [currentStats, sliders, selectedCase]);

      const mqttClientRef = useRef(null);
      const bcRef = useRef(null);

      // --- BROADCAST FUNCTION ---
      const broadcastTeamState = (overrideFields = {}) => {
        const cleanRoom = (roomCode || '482-910').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const mqttTopic = `fiscal_pulse_v5/room_${cleanRoom}`;
        const storageKey = `fp_teams_storage_v5_${cleanRoom}`;

        const growth = Number((((currentStats.treasury - (currentStats.initialTreasury || currentStats.treasury)) / Math.max(1, currentStats.initialTreasury || currentStats.treasury)) * 100).toFixed(1));

        const myTeamPayload = {
          id: myId,
          name: teamName || 'Unnamed Team',
          roomCode: cleanRoom,
          countryName: selectedCase?.name || 'Country',
          round: currentStats.round || 1,
          treasury: currentStats.treasury || 0,
          capitalGrowthPct: growth,
          totalScorePercent: Number(totalScorePercent.toFixed(1)),
          debtToGdp: currentStats.debtToGdp || 0,
          gdpGrowth: currentStats.gdpGrowth || 0,
          status: (budgetPreview.fiscalBalance || 0) >= 0 ? 'SURPLUS' : 'DEFICIT',
          lastActive: Date.now(),
          ...overrideFields
        };

        // Update local state and purge inactive teams (>18s)
        setTeamsMap((prev) => {
          const now = Date.now();
          const next = {};
          Object.keys(prev).forEach((k) => {
            if (now - (prev[k].lastActive || 0) < 18000) {
              next[k] = prev[k];
            }
          });
          next[myTeamPayload.id] = myTeamPayload;
          try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch (e) {}
          return next;
        });

        // Broadcast via BroadcastChannel
        if (bcRef.current) {
          try { bcRef.current.postMessage({ type: 'TEAM_SYNC', team: myTeamPayload }); } catch (e) {}
        }

        // Broadcast via HiveMQ Cloud WebSocket
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          try { mqttClientRef.current.publish(mqttTopic, JSON.stringify({ type: 'TEAM_SYNC', team: myTeamPayload })); } catch (e) {}
        }
      };

      // --- GLOBAL REAL-TIME CLOUD MQTT & BROADCASTCHANNEL SYNC ---
      useEffect(() => {
        const cleanRoom = (roomCode || '482-910').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const mqttTopic = `fiscal_pulse_v5/room_${cleanRoom}`;
        const storageKey = `fp_teams_storage_v5_${cleanRoom}`;

        // 1. Load LocalStorage Cache
        try {
          const cached = localStorage.getItem(storageKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            const now = Date.now();
            const fresh = {};
            Object.keys(parsed).forEach(k => {
              if (now - (parsed[k].lastActive || 0) < 18000) fresh[k] = parsed[k];
            });
            setTeamsMap(fresh);
          }
        } catch (e) {}

        // 2. Setup BroadcastChannel for Same-Browser Tabs
        try {
          bcRef.current = new BroadcastChannel(`fp_bc_v5_${cleanRoom}`);
          bcRef.current.onmessage = (event) => {
            if (event.data && event.data.type === 'TEAM_SYNC' && event.data.team) {
              mergeTeam(event.data.team);
            }
          };
        } catch (e) {}

        // 3. Connect to HiveMQ Public WebSocket Broker
        try {
          if (window.mqtt) {
            const client = window.mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
              clientId: 'fp5_' + myId + '_' + Math.random().toString(16).substr(2, 6),
              clean: true,
              keepalive: 25,
              reconnectPeriod: 2000,
            });

            mqttClientRef.current = client;

            client.on('connect', () => {
              setCloudConnected(true);
              client.subscribe(mqttTopic, { qos: 0 });
              broadcastTeamState();
            });

            client.on('message', (topic, payload) => {
              try {
                const parsed = JSON.parse(payload.toString());
                if (parsed.type === 'TEAM_SYNC' && parsed.team) {
                  mergeTeam(parsed.team);
                }
              } catch (err) {}
            });

            client.on('offline', () => setCloudConnected(false));
            client.on('error', () => setCloudConnected(false));
          }
        } catch (e) {}

        const handleStorage = (e) => {
          if (e.key === storageKey && e.newValue) {
            try { setTeamsMap(JSON.parse(e.newValue)); } catch (err) {}
          }
        };
        window.addEventListener('storage', handleStorage);

        return () => {
          if (bcRef.current) bcRef.current.close();
          if (mqttClientRef.current) mqttClientRef.current.end(true);
          window.removeEventListener('storage', handleStorage);
        };
      }, [roomCode, myId]);

      const mergeTeam = (team) => {
        setTeamsMap((prev) => {
          const next = { ...prev, [team.id]: team };
          const cleanRoom = (roomCode || '482-910').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          try { localStorage.setItem(`fp_teams_storage_v5_${cleanRoom}`, JSON.stringify(next)); } catch (e) {}
          return next;
        });
      };

      // Heartbeat pulse every 3 seconds
      useEffect(() => {
        broadcastTeamState();
        const interval = setInterval(() => { broadcastTeamState(); }, 3000);
        return () => clearInterval(interval);
      }, [teamName, roomCode, currentStats, totalScorePercent, selectedCase]);

      // --- USER ACTIONS ---
      const handleSelectCase = (cCase) => {
        setSelectedCaseId(cCase.id);
        setCurrentStats({ ...cCase.initialStats });
        setSliders({ ...cCase.startSliders });
        setSelectedOptionId('A');
        setRoundScores([]);
        setLastRoundReport(null);

        broadcastTeamState({
          countryName: cCase.name,
          treasury: cCase.initialStats.treasury,
          gdp: cCase.initialStats.gdp,
          debtToGdp: cCase.initialStats.debtToGdp,
          totalScorePercent: 0,
          capitalGrowthPct: 0
        });
      };

      const handleNameChange = (e) => {
        const val = e.target.value;
        setTeamName(val);
        try { localStorage.setItem('fp_profile_team_name_v5', val); } catch (err) {}
        broadcastTeamState({ name: val });
      };

      const startGame = () => {
        broadcastTeamState({ round: 1 });
        setViewMode('DASHBOARD');
      };

      // Shuffled Options according to round.order (e.g. 'CAB' or 'BCA')
      const displayedOptions = useMemo(() => {
        if (!currentRound || !currentRound.options) return [];
        const orderStr = currentRound.order || 'ABC';
        const map = {};
        currentRound.options.forEach(opt => { map[opt.id] = opt; });
        const ordered = [];
        for (let char of orderStr) {
          if (map[char]) ordered.push(map[char]);
        }
        // Add any missing options
        currentRound.options.forEach(opt => {
          if (!ordered.find(o => o.id === opt.id)) ordered.push(opt);
        });
        return ordered;
      }, [currentRound]);

      // Execute Fiscal Round Decision
      const handleExecuteDecision = () => {
        if (!currentRound || !FP_ENGINE.simulateFiscalRound) return;
        const option = currentRound.options.find(o => o.id === selectedOptionId) || currentRound.options[0];
        const res = FP_ENGINE.simulateFiscalRound(currentStats, sliders, option, currentRound.targets, selectedCase);

        const newScores = [...roundScores, {
          round: currentStats.round,
          yearLabel: currentRound.yearLabel,
          optionScore: res.roundScore.optionScore,
          sliderScore: res.roundScore.sliderScore,
          roundTotalPercent: res.roundScore.roundTotalPercent,
          sliderBreakdown: res.roundScore.sliderBreakdown
        }];

        const newTotalPercent = newScores.reduce((acc, r) => acc + r.roundTotalPercent, 0);

        setRoundScores(newScores);
        setLastRoundReport({
          yearLabel: currentRound.yearLabel,
          title: currentRound.title,
          roundNumber: currentStats.round,
          optionChosen: option,
          roundScore: res.roundScore,
          feedbackCards: res.feedbackCards,
          statsBefore: { ...currentStats },
          statsAfter: { ...res.nextStats },
          capitalDelta: res.capitalDelta,
          capitalGrowthPct: res.capitalGrowthPct
        });

        setCurrentStats(res.nextStats);

        broadcastTeamState({
          round: res.nextStats.round,
          treasury: res.nextStats.treasury,
          capitalGrowthPct: res.capitalGrowthPct,
          totalScorePercent: Number(newTotalPercent.toFixed(1)),
          debtToGdp: res.nextStats.debtToGdp,
          gdpGrowth: res.nextStats.gdpGrowth,
          status: res.preview.fiscalStatus
        });

        setViewMode('ROUND_FEEDBACK');
      };

      const handleProceedNextRound = () => {
        if (currentStats.round > 5) {
          setViewMode('FINAL_DEBRIEF');
        } else {
          // Preselect first option of the new round
          const nextRoundIndex = currentStats.round - 1;
          const nextRoundObj = selectedCase.rounds[nextRoundIndex];
          if (nextRoundObj && nextRoundObj.order) {
            setSelectedOptionId(nextRoundObj.order[0]);
          } else {
            setSelectedOptionId('A');
          }
          setViewMode('DASHBOARD');
        }
      };

      // Leaderboard Ranking (Strictly ranked by Total Score % out of 500%, then Treasury Capital Growth)
      const sortedTeams = useMemo(() => {
        const now = Date.now();
        const activeList = Object.values(teamsMap).filter(t => t.id === myId || (now - (t.lastActive || 0) < 18000));
        const growth = Number((((currentStats.treasury - (currentStats.initialTreasury || currentStats.treasury)) / Math.max(1, currentStats.initialTreasury || currentStats.treasury)) * 100).toFixed(1));

        const myTeamObj = {
          id: myId,
          name: teamName || 'Unnamed Team',
          countryName: selectedCase?.name || 'Historical Case',
          round: currentStats.round || 1,
          treasury: currentStats.treasury || 0,
          capitalGrowthPct: growth,
          totalScorePercent: Number(totalScorePercent.toFixed(1)),
          debtToGdp: currentStats.debtToGdp || 0,
          status: (budgetPreview.fiscalBalance || 0) >= 0 ? 'SURPLUS' : 'DEFICIT',
          lastActive: now
        };

        const mapWithoutMe = activeList.filter(t => t.id !== myId);
        const finalList = [myTeamObj, ...mapWithoutMe];

        return finalList.sort((a, b) => {
          if ((b.totalScorePercent || 0) !== (a.totalScorePercent || 0)) {
            return (b.totalScorePercent || 0) - (a.totalScorePercent || 0);
          }
          return (b.capitalGrowthPct || 0) - (a.capitalGrowthPct || 0);
        });
      }, [teamsMap, myId, teamName, currentStats, totalScorePercent, selectedCase, budgetPreview]);

      const getGrade = (scorePct) => {
        if (scorePct >= 450) return { title: 'A+ Distinguished Statesperson', color: 'bg-emerald-500 text-white' };
        if (scorePct >= 380) return { title: 'A Master Macroeconomist', color: 'bg-emerald-600 text-white' };
        if (scorePct >= 300) return { title: 'B Competent Technocrat', color: 'bg-[#2A9D8F] text-white' };
        if (scorePct >= 200) return { title: 'C Fiscal Muddler', color: 'bg-amber-500 text-white' };
        return { title: 'D Sovereign Distress & IMF Receivership', color: 'bg-[#E04F3E] text-white' };
      };

      // ======================================================================
      // 1. RENDER: LOBBY VIEW
      // ======================================================================
      if (viewMode === 'LOBBY') {
        return (
          <div className="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
            {/* Header Banner */}
            <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-6 shadow-brutal flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="bg-[#E04F3E] text-white px-2 py-0.5 text-xs font-mono font-bold uppercase tracking-widest">
                    Real-Time Macroeconomic Simulator
                  </span>
                  <a
                    href="./presentation.html"
                    className="border border-[#1E1E1E] bg-[#E9C46A] hover:bg-[#1E1E1E] hover:text-white px-2.5 py-0.5 text-xs font-mono font-bold transition flex items-center gap-1 shadow-sm"
                  >
                    <span>📊</span> <span>Open Lecture Deck ↗</span>
                  </a>
                  <span className={`text-[10px] font-mono px-2 py-0.5 border font-bold flex items-center gap-1 ${
                    cloudConnected ? 'bg-emerald-50 text-emerald-800 border-emerald-600' : 'bg-amber-50 text-amber-800 border-amber-600'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${cloudConnected ? 'bg-emerald-600 animate-pulse' : 'bg-amber-600'}`} />
                    {cloudConnected ? 'Cloud Online Sync Active' : 'Connecting Broker...'}
                  </span>
                </div>
                <h1 className="text-2xl md:text-3xl font-extrabold uppercase mt-2 text-[#1E1E1E]">
                  Fiscal Pulse: <span className="text-[#2A9D8F]">National Budget Simulator</span>
                </h1>
                <p className="text-xs text-[#264653] font-mono mt-1 max-w-2xl">
                  5 Fiscal Years per simulation (Max 500% Score). Students choose policy responses and calibrate budget & monetary levers to navigate historical crises.
                </p>
              </div>

              {/* Room Code Card */}
              <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-3 text-right shrink-0 w-full md:w-auto">
                <div className="text-[10px] font-mono uppercase text-[#264653] font-bold">Classroom Room Code</div>
                <input
                  type="text"
                  value={roomCode}
                  onChange={(e) => setRoomCode(e.target.value)}
                  className="bg-white border border-[#1E1E1E] px-3 py-1 font-mono text-xl font-bold tracking-widest text-center mt-1 w-36 uppercase focus:outline-none"
                  placeholder="482-910"
                />
              </div>
            </div>

            {/* Country Cards Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {FP_CASES.map(c => (
                <div
                  key={c.id}
                  onClick={() => handleSelectCase(c)}
                  className={`cursor-pointer border border-[#1E1E1E] p-5 bg-[#FFFFFF] transition relative ${
                    selectedCaseId === c.id ? 'shadow-brutal ring-2 ring-[#1E1E1E] bg-amber-50/20' : 'hover:bg-[#FAF8F2]'
                  }`}
                >
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-mono font-bold text-[#E04F3E]">CASE {c.codeNumber} • {c.era}</span>
                    <span className="text-xs font-mono border border-[#1E1E1E] px-2 py-0.5 bg-[#F7F4EB] font-bold">5 Fiscal Years</span>
                  </div>
                  <h3 className="text-xl font-bold uppercase mt-1.5 text-[#1E1E1E]">{c.name}: {c.subtitle}</h3>
                  <p className="text-xs text-[#264653] mt-2 leading-relaxed line-clamp-3">{c.briefing}</p>

                  <div className="mt-4 pt-3 border-t border-[#1E1E1E] grid grid-cols-3 gap-2 font-mono text-xs">
                    <div><span className="text-[10px] text-[#264653] block">Treasury</span><strong className="text-[#2A9D8F]">${c.initialStats.treasury}M</strong></div>
                    <div><span className="text-[10px] text-[#264653] block">Real GDP</span><strong>${c.initialStats.gdp}M</strong></div>
                    <div><span className="text-[10px] text-[#264653] block">Debt/GDP</span><strong className="text-[#E04F3E]">{c.initialStats.debtToGdp}%</strong></div>
                  </div>

                  {c.monetaryLocked && (
                    <div className="mt-3 text-[10px] font-mono bg-blue-50 text-blue-900 border border-blue-300 p-1.5 font-bold flex items-center gap-1">
                      <span>💶</span> <span>Eurozone Member: Interest Rate locked to ECB (1.0%)</span>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* Live Connected Teams Roster */}
            <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-5 shadow-brutal space-y-3">
              <div className="flex justify-between items-center border-b border-[#1E1E1E] pb-2">
                <span className="font-mono font-bold text-xs uppercase text-[#1E1E1E]">
                  🟢 Connected Teams in Room [{roomCode}]: ({sortedTeams.length} Active)
                </span>
                <span className="text-[11px] font-mono text-[#264653]">Classroom Real-Time Multiplayer</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 font-mono text-xs">
                {sortedTeams.map((t, idx) => (
                  <div key={t.id} className={`p-2.5 border border-[#1E1E1E] flex justify-between items-center ${t.id === myId ? 'bg-[#E9C46A]/25 ring-1 ring-[#1E1E1E]' : 'bg-[#F7F4EB]'}`}>
                    <div>
                      <div className="font-bold text-[#1E1E1E]">#{idx + 1} {t.name} {t.id === myId && '(You)'}</div>
                      <div className="text-[10px] text-[#264653] font-semibold">{t.countryName || selectedCase?.name}</div>
                    </div>
                    <span className="text-[10px] bg-[#1E1E1E] text-white px-1.5 py-0.5 uppercase font-bold">Ready</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Team Name Input & Start Button */}
            <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-4 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-brutal">
              <div className="w-full sm:w-auto flex items-center gap-2">
                <span className="font-mono text-xs font-bold text-[#1E1E1E]">Your Team Name:</span>
                <input
                  type="text"
                  value={teamName}
                  onChange={handleNameChange}
                  placeholder="Enter Team Name"
                  className="border border-[#1E1E1E] px-3 py-1.5 text-xs font-mono w-64 font-bold focus:outline-none"
                />
              </div>
              <button
                onClick={startGame}
                className="w-full sm:w-auto bg-[#1E1E1E] text-white font-mono font-bold text-xs uppercase px-8 py-2.5 shadow-brutal hover:bg-[#264653] transition"
              >
                Enter National Cabinet →
              </button>
            </div>
          </div>
        );
      }

      // ======================================================================
      // 2. RENDER: FINAL ASSESSMENT & PODIUM VIEW
      // ======================================================================
      if (viewMode === 'FINAL_DEBRIEF') {
        const hist = selectedCase?.historicalOutcome || {};
        const myGrowthPct = Number((((currentStats.treasury - (currentStats.initialTreasury || currentStats.treasury)) / Math.max(1, currentStats.initialTreasury || currentStats.treasury)) * 100).toFixed(1));
        const grade = getGrade(totalScorePercent);

        return (
          <div className="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
            <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-6 shadow-brutal flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>

                      type="range" min="0" max="12" step="0.5"
                      value={sliders.infra}
                      onChange={e => setSliders({ ...sliders, infra: Number(e.target.value) })}
                      className="w-full mt-1.5"
                    />
                    <div className="text-[10px] text-[#264653] mt-1 flex justify-between">
                      <span>Outlay: ${budgetPreview.infraExp}M</span>
                      <span className="text-[#2A9D8F] font-bold">Multiplier 1.4x</span>
                    </div>
                  </div>

                  {/* Education & R&D */}
                  <div>
                    <div className="flex justify-between font-bold">
                      <span>Education & R&D</span>
                      <span className="text-[#1E1E1E] bg-[#F7F4EB] px-1.5 py-0.5 border border-[#1E1E1E]">{sliders.edu}% of GDP</span>
                    </div>
                    <input
                      type="range" min="0" max="10" step="0.5"
                      value={sliders.edu}
                      onChange={e => setSliders({ ...sliders, edu: Number(e.target.value) })}
                      className="w-full mt-1.5"
                    />
                    <div className="text-[10px] text-[#264653] mt-1 flex justify-between">
                      <span>Outlay: ${budgetPreview.eduExp}M</span>
                      <span className="text-[#2A9D8F] font-bold">Human Capital Lag</span>
                    </div>
                  </div>

                  {/* Healthcare & Social Safety Nets */}
                  <div>
                    <div className="flex justify-between font-bold">
                      <span>Healthcare & Social</span>
                      <span className="text-[#1E1E1E] bg-[#F7F4EB] px-1.5 py-0.5 border border-[#1E1E1E]">{sliders.health}% of GDP</span>
                    </div>
                    <input
                      type="range" min="1" max="14" step="0.5"
                      value={sliders.health}
                      onChange={e => setSliders({ ...sliders, health: Number(e.target.value) })}
                      className="w-full mt-1.5"
                    />
                    <div className="text-[10px] text-[#264653] mt-1 flex justify-between">
                      <span>Outlay: ${budgetPreview.healthExp}M</span>
                      <span>Approval Anchor</span>
                    </div>
                  </div>

                  {/* Subsidies & Grants */}
                  <div>
                    <div className="flex justify-between font-bold">
                      <span>Targeted Subsidies</span>
                      <span className="text-[#1E1E1E] bg-[#F7F4EB] px-1.5 py-0.5 border border-[#1E1E1E]">{sliders.subsidy}% of GDP</span>
                    </div>
                    <input
                      type="range" min="0" max="10" step="0.5"
                      value={sliders.subsidy}
                      onChange={e => setSliders({ ...sliders, subsidy: Number(e.target.value) })}
                      className="w-full mt-1.5"
                    />
                    <div className="text-[10px] text-[#264653] mt-1 flex justify-between">
                      <span>Outlay: ${budgetPreview.subsidyExp}M</span>
                      <span className={sliders.subsidy > 6 ? 'text-[#E04F3E] font-bold' : ''}>
                        {sliders.subsidy > 6 ? '⚠️ Fiscal Drain' : 'Targeted Relief'}
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Total Expenditures & Fiscal Balance Summary */}
              <div className="p-3 bg-[#F7F4EB] border-t border-[#1E1E1E] font-mono text-xs space-y-2">
                <div className="flex justify-between text-[#264653]">
                  <span>Programmatic Outlays:</span>
                  <span className="font-bold text-[#1E1E1E]">${budgetPreview.programmaticSpending}M</span>
                </div>
                <div className="flex justify-between text-[#264653]">
                  <span>Debt Service Paid:</span>
                  <span className="font-bold text-[#1E1E1E]">${budgetPreview.debtServicingPaid}M</span>
                </div>
                <div className="flex justify-between pt-1 border-t border-[#1E1E1E]">
                  <span className="font-bold">Total Budget Outlays:</span>
                  <span className="font-bold text-[#E04F3E]">${budgetPreview.totalExpenditure}M</span>
                </div>
                <div className="p-2 border border-[#1E1E1E] bg-white flex justify-between items-center">
                  <span className="text-[10px] uppercase font-bold text-[#264653]">Year Balance:</span>
                  <span className={`font-mono font-bold text-sm ${budgetPreview.fiscalBalance >= 0 ? 'text-[#2A9D8F]' : 'text-[#E04F3E]'}`}>
                    {budgetPreview.fiscalBalance >= 0 ? 'SURPLUS' : 'DEFICIT'} ({budgetPreview.fiscalBalance >= 0 ? '+' : ''}${budgetPreview.fiscalBalance}M)
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* CLASSROOM COHORT LIVE STANDINGS STRIP */}
          <div className="border border-[#1E1E1E] bg-[#FFFFFF] p-4 shadow-brutal">
            <div className="flex justify-between items-center border-b border-[#1E1E1E] pb-2 mb-3">
              <span className="font-mono font-bold text-xs uppercase text-[#1E1E1E]">
                📊 Classroom Cohort Standings (Room {roomCode})
              </span>
              <span className="text-[10px] font-mono text-[#264653]">
                Ranked by Total Score % (out of 500%) → Treasury Growth
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 font-mono text-xs">
              {sortedTeams.map((team, idx) => (
                <div
                  key={team.id}
                  className={`border border-[#1E1E1E] p-2 flex justify-between items-center ${
                    team.id === myId ? 'bg-[#E9C46A]/25 ring-1 ring-[#1E1E1E]' : 'bg-[#F7F4EB]'
                  }`}
                >
                  <div>
                    <div className="font-bold text-[#1E1E1E]">
                      #{idx + 1} {team.name} {team.id === myId && '(You)'}
                    </div>
                    <div className="text-[10px] text-[#264653]">
                      RD {team.round || 1} • {team.totalScorePercent || 0}% / 500%
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="font-extrabold text-[#1E1E1E]">
                      ${team.treasury}M
                    </div>
                    <span className={`text-[9px] font-bold px-1 uppercase text-white ${
                      team.status === 'SURPLUS' ? 'bg-[#2A9D8F]' : 'bg-[#E04F3E]'
                    }`}>
                      {team.status || 'SURPLUS'}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* ==================================================================
              CENTER DYNAMIC FEEDBACK MODAL (AFTER EACH ROUND)
              ================================================================== */}
          {viewMode === 'ROUND_FEEDBACK' && lastRoundReport && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 md:p-4 z-50 animate-in fade-in">
              <div className="bg-white border-2 border-[#1E1E1E] max-w-2xl w-full p-5 md:p-6 shadow-brutal-lg space-y-4 max-h-[90vh] overflow-y-auto">

                {/* Modal Title Banner */}
                <div className="bg-[#1E1E1E] text-white p-3 font-mono font-bold text-xs uppercase flex justify-between items-center">
                  <span>Fiscal Year {lastRoundReport.roundNumber} ({lastRoundReport.yearLabel}) Concluded</span>
                  <span className="text-[#E9C46A] text-sm">
                    Score: +{lastRoundReport.roundScore.roundTotalPercent}% / 100%
                  </span>
                </div>

                {/* Score Breakdown Summary Box */}
                <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-3.5 font-mono text-xs grid grid-cols-3 gap-2 text-center">
                  <div className="border border-[#1E1E1E] bg-white p-2">
                    <span className="text-[10px] text-[#264653] uppercase block">Policy Choice</span>
                    <strong className="text-base text-[#1E1E1E]">+{lastRoundReport.roundScore.optionScore}</strong>
                    <span className="text-[10px] text-[#264653]"> / 50 pts</span>
                  </div>
                  <div className="border border-[#1E1E1E] bg-white p-2">
                    <span className="text-[10px] text-[#264653] uppercase block">Slider Targets</span>
                    <strong className="text-base text-[#1E1E1E]">+{lastRoundReport.roundScore.sliderScore}</strong>
                    <span className="text-[10px] text-[#264653]"> / 50 pts</span>
                  </div>
                  <div className="border border-[#1E1E1E] bg-[#E9C46A]/30 p-2">
                    <span className="text-[10px] text-[#264653] uppercase block">Cumulative Total</span>
                    <strong className="text-base text-[#1E1E1E]">{totalScorePercent.toFixed(1)}%</strong>
                    <span className="text-[10px] text-[#264653]"> / 500%</span>
                  </div>
                </div>

                {/* Dynamic State-of-the-Nation Feedback Cards (Capital flight, tax base, inflation, etc.) */}
                <div className="space-y-2.5">
                  <div className="font-mono text-xs font-bold text-[#1E1E1E] uppercase border-b border-[#1E1E1E] pb-1">
                    State of the Nation: Economic Consequences
                  </div>
                  {lastRoundReport.feedbackCards.map((card, idx) => (
                    <div
                      key={idx}
                      className={`border border-[#1E1E1E] p-3 text-xs leading-relaxed ${
                        card.type === 'DANGER' ? 'bg-rose-50/80 border-rose-300' :
                        card.type === 'WARNING' ? 'bg-amber-50/80 border-amber-300' :
                        'bg-emerald-50/80 border-emerald-300'
                      }`}
                    >
                      <div className="flex items-center gap-2 font-mono font-bold text-[11px] mb-1">
                        <span>{card.icon}</span>
                        <span className={
                          card.type === 'DANGER' ? 'text-rose-800' :
                          card.type === 'WARNING' ? 'text-amber-800' :
                          'text-emerald-800'
                        }>{card.tag}</span>
                      </div>
                      <div className="font-bold text-[#1E1E1E] mb-0.5">{card.headline}</div>
                      <p className="text-[#264653] font-sans">{card.text}</p>
                    </div>
                  ))}
                </div>

                {/* Target Sliders vs Your Sliders Comparison Table */}
                {lastRoundReport.roundScore.sliderBreakdown && lastRoundReport.roundScore.sliderBreakdown.length > 0 && (
                  <div className="space-y-2 font-mono text-xs">
                    <div className="font-bold uppercase text-[#1E1E1E] border-b border-[#1E1E1E] pb-1">
                      Slider Calibration Analysis
                    </div>
                    <div className="border border-[#1E1E1E] divide-y divide-[#1E1E1E] bg-white">
                      {lastRoundReport.roundScore.sliderBreakdown.map((item, idx) => (
                        <div key={idx} className="p-2.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                          <div className="space-y-0.5">
                            <div className="font-bold text-[#1E1E1E]">
                              {item.key.toUpperCase()}: Set to <strong>{item.userValue}%</strong> (Target: {item.targetLo}–{item.targetHi}%)
                            </div>
                            <div className="text-[11px] text-[#264653] font-sans">
                              {item.why}
                            </div>
                          </div>
                          <div className="shrink-0 flex items-center gap-2">
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 uppercase ${
                              item.status === 'OPTIMAL' ? 'bg-emerald-100 text-emerald-800' :
                              item.status === 'ACCEPTABLE' ? 'bg-amber-100 text-amber-800' :
                              'bg-rose-100 text-rose-800'
                            }`}>
                              {item.status}
                            </span>
                            <span className="font-bold text-[#1E1E1E]">
                              +{item.pointsEarned} / {item.maxPoints} pts
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Macro Movement Pulse */}
                <div className="border border-[#1E1E1E] bg-[#F7F4EB] p-2.5 font-mono text-xs flex justify-between items-center">
                  <div>
                    <span className="text-[10px] text-[#264653] uppercase block">Treasury Capital Shift:</span>
                    <strong className="text-sm text-[#1E1E1E]">
                      ${lastRoundReport.statsAfter.treasury}M ({lastRoundReport.capitalGrowthPct >= 0 ? '+' : ''}{lastRoundReport.capitalGrowthPct}%)
                    </strong>
                  </div>
                  <div>
                    <span className="text-[10px] text-[#264653] uppercase block">Real GDP Growth:</span>
                    <strong className="text-sm text-[#2A9D8F]">{lastRoundReport.statsAfter.gdpGrowth}%</strong>
                  </div>
                  <div>
                    <span className="text-[10px] text-[#264653] uppercase block">Debt/GDP:</span>
                    <strong className="text-sm text-[#1E1E1E]">{lastRoundReport.statsAfter.debtToGdp}%</strong>
                  </div>
                </div>

                {/* Continue Action */}
                <div className="flex justify-end pt-2 border-t border-[#1E1E1E]">
                  <button
                    onClick={handleProceedNextRound}
                    className="bg-[#1E1E1E] text-white px-6 py-2.5 font-mono font-bold text-xs uppercase shadow-brutal hover:bg-[#264653] transition"
                  >
                    {lastRoundReport.roundNumber >= 5 ? 'View Final Assessment & Podium →' : `Proceed to Fiscal Year ${lastRoundReport.roundNumber + 1} →`}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
